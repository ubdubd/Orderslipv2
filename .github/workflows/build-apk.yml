name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -o OrderSlipAndroid_AutoUpdate_Fixed.zip -d project

          echo "=== Searching for gradlew ==="
          find project -type f -name "gradlew" -print

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Find and Build APK
        run: |
          GRADLEW=$(find project -type f -name "gradlew" | head -1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found in the extracted project."
            echo "Project structure:"
            find project -maxdepth 5 -type f | sort
            exit 1
          fi

          echo "Found Gradle wrapper: $GRADLEW"

          PROJECT_DIR=$(dirname "$GRADLEW")
          cd "$PROJECT_DIR"

          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OrderSlip-APK
          path: project/**/app/build/outputs/apk/debug/app-debug.apk
