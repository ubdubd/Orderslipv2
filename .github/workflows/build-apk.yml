name: Release APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          ZIP="$(find . -maxdepth 3 -iname 'OrderSlipAndroid*.zip' | head -n 1)"
          if [ -z "$ZIP" ]; then
            echo "Zip file not found in repo"
            ls -R | head -100
            exit 1
          fi
          echo "Using: $ZIP"
          unzip -o "$ZIP" -d project
          ls -la project/OrderSlipAndroid

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Gradle Wrapper
        working-directory: project/OrderSlipAndroid
        run: |
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew

      - name: Enable AndroidX
        working-directory: project/OrderSlipAndroid
        run: |
          touch gradle.properties
          grep -q "android.useAndroidX" gradle.properties || echo "android.useAndroidX=true" >> gradle.properties
          grep -q "android.enableJetifier" gradle.properties || echo "android.enableJetifier=true" >> gradle.properties
          cat gradle.properties

      - name: Set compileSdk 35
        working-directory: project/OrderSlipAndroid
        run: |
          sed -i -E 's/compileSdk(Version)?[ =]+[0-9]+/compileSdk 35/' app/build.gradle
          grep -n "compileSdk" app/build.gradle

      - name: Set version
        working-directory: project/OrderSlipAndroid
        run: |
          VERSION_CODE=${{ github.run_number }}
          VERSION_NAME="3.0.$VERSION_CODE"
          sed -i -E "s/versionCode[ =]+[0-9]+/versionCode $VERSION_CODE/" app/build.gradle
          sed -i -E "s/versionName[ =]+'[^']+'/versionName '$VERSION_NAME'/" app/build.gradle
          sed -i -E "s/versionName[ =]+\"[^\"]+\"/versionName \"$VERSION_NAME\"/" app/build.gradle
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          grep -nE "versionCode|versionName" app/build.gradle

      - name: Restore or generate keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -f "release-key.jks" ]; then
            echo "Existing keystore found in repo — reusing it."
            cp release-key.jks project/OrderSlipAndroid/app/release-key.jks
          else
            echo "No keystore in repo — generating a new one (first time only)."
            keytool -genkeypair -v \
              -keystore project/OrderSlipAndroid/app/release-key.jks \
              -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEYSTORE_PASSWORD" \
              -dname "CN=OrderSlip, OU=OrderSlip, O=OrderSlip, L=Kerala, S=Kerala, C=IN"
            cp project/OrderSlipAndroid/app/release-key.jks release-key.jks
          fi
          test -s project/OrderSlipAndroid/app/release-key.jks
          echo "Keystore ready."

      - name: Configure release signing
        working-directory: project/OrderSlipAndroid
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle")
          s = p.read_text()

          block = '''
              signingConfigs {
                  release {
                      storeFile file("release-key.jks")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEYSTORE_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          '''

          if "signingConfigs {" not in s:
              s = s.replace("android {", "android {" + block, 1)

          p.write_text(s)
          PY
          echo "Updated build.gradle:"
          cat app/build.gradle

      - name: Build signed release APK
        working-directory: project/OrderSlipAndroid
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          chmod +x gradlew
          ./gradlew clean assembleRelease --no-daemon

      - name: Prepare APK
        run: |
          cp project/OrderSlipAndroid/app/build/outputs/apk/release/app-release.apk OrderSlip.apk
          ls -lh OrderSlip.apk

      - name: Commit keystore to repo (first time only)
        run: |
          if [ -n "$(git status --porcelain release-key.jks)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add release-key.jks
            git commit -m "Add release signing keystore (auto-generated)"
            git push
            echo "Keystore committed to repo — future builds will reuse it."
          else
            echo "Keystore already in repo — nothing to commit."
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrderSlip-APK
          path: OrderSlip.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: OrderSlip v${{ env.VERSION_NAME }}
          generate_release_notes: true
          files: OrderSlip.apk
