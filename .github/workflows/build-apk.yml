name: Release APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          ZIP="$(find . -maxdepth 3 -iname 'OrderSlipAndroid*.zip' | head -n 1)"
          if [ -z "$ZIP" ]; then
            echo "Zip file not found in repo"
            ls -R | head -100
            exit 1
          fi

          echo "Using: $ZIP"
          unzip -o "$ZIP" -d project

          test -f project/OrderSlipAndroid/gradlew || true
          ls -la project/OrderSlipAndroid

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Gradle Wrapper
        working-directory: project/OrderSlipAndroid
        run: |
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew

      - name: Enable AndroidX
        working-directory: project/OrderSlipAndroid
        run: |
          touch gradle.properties
          grep -q "android.useAndroidX" gradle.properties || \
            echo "android.useAndroidX=true" >> gradle.properties

          grep -q "android.enableJetifier" gradle.properties || \
            echo "android.enableJetifier=true" >> gradle.properties

          cat gradle.properties

      - name: Set compileSdk 35
        working-directory: project/OrderSlipAndroid
        run: |
          sed -i -E 's/compileSdk(Version)?[ =]+[0-9]+/compileSdk 35/' app/build.gradle
          grep -n "compileSdk" app/build.gradle

      - name: Set version 3.0.0
        working-directory: project/OrderSlipAndroid
        run: |
          sed -i -E 's/versionCode[ =]+[0-9]+/versionCode 3/' app/build.gradle
          sed -i -E 's/versionName[ =]+"[^"]+"/versionName "3.0.0"/' app/build.gradle

          echo "Version settings:"
          grep -nE "versionCode|versionName" app/build.gradle

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > project/OrderSlipAndroid/app/release-key.jks
          test -s project/OrderSlipAndroid/app/release-key.jks
          echo "Keystore created successfully."

      - name: Configure release signing
        working-directory: project/OrderSlipAndroid
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/build.gradle")
          s = p.read_text()

          signing_block = '''
              signingConfigs {
                  release {
                      storeFile file("release-key.jks")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEYSTORE_PASSWORD")
                  }
              }
          '''

          if "signingConfigs {" not in s:
              s = s.replace(
                  "android {",
                  "android {" + signing_block,
                  1
              )

          if "signingConfig signingConfigs.release" not in s:
              pattern = r'(buildTypes\\s*\\{\\s*release\\s*\\{)'
              s, count = re.subn(
                  pattern,
                  r'\\1\n            signingConfig signingConfigs.release',
                  s,
                  count=1
              )

              if count == 0:
                  raise SystemExit("Could not find release buildType")

          p.write_text(s)
          PY

          echo "Signing configuration:"
          grep -n -A10 -B2 "signingConfigs" app/build.gradle
          echo "Release build type:"
          grep -n -A8 "release {" app/build.gradle | head -20

      - name: Build signed release APK
        working-directory: project/OrderSlipAndroid
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          chmod +x gradlew
          ./gradlew clean assembleRelease --no-daemon

      - name: Prepare APK
        run: |
          cp project/OrderSlipAndroid/app/build/outputs/apk/release/app-release.apk OrderSlip.apk
          ls -lh OrderSlip.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrderSlip-APK-v3.0.0
          path: OrderSlip.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.0
          name: OrderSlip v3.0.0
          generate_release_notes: true
          files: OrderSlip.apk
