name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -o OrderSlipAndroid_AutoUpdate_Fixed.zip -d project

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Gradle Wrapper
        working-directory: project/OrderSlipAndroid
        run: |
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew

      - name: Enable AndroidX
        working-directory: project/OrderSlipAndroid
        run: |
          touch gradle.properties
          echo "" >> gradle.properties
          grep -q "android.useAndroidX" gradle.properties || echo "android.useAndroidX=true" >> gradle.properties
          cat gradle.properties

      - name: Set compileSdk 35
        working-directory: project/OrderSlipAndroid
        run: |
          sed -i -E 's/compileSdk(Version)?[ =]+[0-9]+/compileSdk 35/' app/build.gradle
          grep -n "compileSdk" app/build.gradle

      - name: Use fixed signing key
        run: |
          if [ -f debug.keystore ]; then
            mkdir -p ~/.android
            cp debug.keystore ~/.android/debug.keystore
          fi

      - name: Build APK
        working-directory: project/OrderSlipAndroid
        run: |
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OrderSlip-APK
          path: project/OrderSlipAndroid/app/build/outputs/apk/debug/app-debug.apk
